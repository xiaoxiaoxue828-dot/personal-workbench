<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f3f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="个人工作台" />
  <title>个人工作台</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="appShell" class="app-shell">
    <header class="topbar">
      <div class="topbar-title">
        <p class="eyebrow">MY PERSONAL DESK</p>
        <h1 id="pageTitle">首页 · 今日概览</h1>
      </div>
      <div class="top-actions">
        <button id="searchBtn" class="round-btn soft" aria-label="全局搜索">⌕</button>
        <button id="quickAddBtn" class="round-btn" aria-label="新建">＋</button>
      </div>
    </header>

    <main id="appContent" class="content"></main>

    <nav id="subNav" class="sub-nav" aria-label="二级导航"></nav>
    <nav id="mainNav" class="main-nav" aria-label="主导航"></nav>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">新建</h2>
        <button id="closeModalBtn" class="text-btn">关闭</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
